[Service]
# FP8 + vision profile: same tuned v2.3 stack, different model / context / cache.
# Rollback to the NVFP4 profile: delete this drop-in and run
#   systemctl daemon-reload && systemctl restart sglang-qwen38
ExecStart=
ExecStart=/root/run-sglang-qwen38-fp8.sh
StandardOutput=append:/root/sglang-qwen38-fp8.log
StandardError=append:/root/sglang-qwen38-fp8.log
